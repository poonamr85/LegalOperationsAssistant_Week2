<text x="100" y="466" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Employee</text>
<text x="100" y="508" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">question</text>
<polyline points="170,490 210,490" fill="none" stroke="#64748b" stroke-width="4"/>
<polygon points="210,490 198,483 198,497" fill="#64748b"/>
