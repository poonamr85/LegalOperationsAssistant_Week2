<text x="382" y="493" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">BM25 keywords +</text>
<text x="382" y="529" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Chroma semantic search</text>
<rect x="595" y="395" width="345" height="190" rx="18" fill="#f0f7e9" stroke="#6a9348" stroke-width="2"/>
<text x="767" y="438" font-family="Arial,sans-serif" font-size="27" fill="#213547" text-anchor="middle" dominant-baseline="middle">2. Assess evidence</text>
<text x="767" y="493" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Relevant and applicable?</text>
<text x="767" y="529" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Enough support to proceed?</text>
<rect x="980" y="395" width="345" height="190" rx="18" fill="#f5f0fc" stroke="#8a63b5" stroke-width="2"/>
<text x="1152" y="438" font-family="Arial,sans-serif" font-size="27" fill="#213547" text-anchor="middle" dominant-baseline="middle">3. Draft response</text>
<text x="1152" y="493" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Use selected evidence</text>
<text x="1152" y="529" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Include source citations</text>
<rect x="1365" y="395" width="345" height="190" rx="18" fill="#ecf8f7" stroke="#219295" stroke-width="2"/>
<text x="1537" y="438" font-family="Arial,sans-serif" font-size="27" fill="#213547" text-anchor="middle" dominant-baseline="middle">4. Validate</text>
<text x="1537" y="493" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Check citation IDs</text>
<text x="1537" y="529" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Check factual claim support</text>
