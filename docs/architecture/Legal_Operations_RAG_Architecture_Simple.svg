<polygon points="1385,810 1378,798 1392,798" fill="#bb695e"/>
<rect x="210" y="810" width="1520" height="115" rx="18" fill="#fff3ef" stroke="#bb695e" stroke-width="2"/>
<text x="970" y="848" font-family="Arial,sans-serif" font-size="27" fill="#a34d42" text-anchor="middle" dominant-baseline="middle">CONTACT LEGAL</text>
<text x="970" y="891" font-family="Arial,sans-serif" font-size="23" fill="#213547" text-anchor="middle" dominant-baseline="middle">Insufficient evidence, human approval needed, or a failed check / processing error</text>
<text x="900" y="970" font-family="Arial,sans-serif" font-size="22" fill="#213547" text-anchor="middle" dominant-baseline="middle">An explicit request for a human goes directly to Contact Legal.</text>
<text x="900" y="1005" font-family="Arial,sans-serif" font-size="21" fill="#64748b" text-anchor="middle" dominant-baseline="middle">The prototype displays a contact message; it does not automatically notify Legal.</text>
</svg>