<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040"><rect width="100%" height="100%" fill="white"/>
<text x="900" y="65" font-family="Arial,sans-serif" font-size="42" fill="#213547" text-anchor="middle" dominant-baseline="middle">Legal Operations Assistant</text>
<text x="900" y="112" font-family="Arial,sans-serif" font-size="25" fill="#213547" text-anchor="middle" dominant-baseline="middle">Find policy evidence. Check the response. Answer or contact Legal.</text>
