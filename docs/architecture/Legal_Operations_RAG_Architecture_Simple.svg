<text x="900" y="192" font-family="Arial,sans-serif" font-size="21" fill="#213547" text-anchor="middle" dominant-baseline="middle">PREPARE THE KNOWLEDGE BASE • WHEN DOCUMENTS CHANGE</text>
<text x="900" y="236" font-family="Arial,sans-serif" font-size="25" fill="#213547" text-anchor="middle" dominant-baseline="middle">Fictional FAQs, policies &amp; reviewed matters → Split passages → MiniLM embeddings → Chroma</text>
<text x="80" y="340" font-family="Arial,sans-serif" font-size="22" fill="#213547" text-anchor="start" dominant-baseline="middle">EACH EMPLOYEE QUESTION</text>
